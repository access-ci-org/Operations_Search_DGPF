{% load urldecode %}
<table class="table table-striped table-bordered">
  <tbody>
  {% block detail_general_metadata %}
  <tr>{{ request.path|urldecode }}</tr>
  {% for item in detail_result_display_fields %}
  <tr>
    <td>{{item.display_name}}</td>
    <td>{{item.value}}</td>
  </tr>
  {% endfor %}
  {% endblock %}
  </tbody>
</table>
